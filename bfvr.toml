# BFVR default configuration
#
# This file is intentionally present before the runtime implementation so the
# portable package contract is stable from the outset. Values are placeholders
# until their corresponding implementation milestones are complete.

[runtime]
# Set true only once BFVR has a validated in-process client module.
enabled = false
# "auto" uses the OpenXR runtime selected by Windows/SteamVR/vendor software.
openxr_runtime = "auto"
# "safe" must always preserve a flat-game fallback on initialization failure.
startup_mode = "safe"

[logging]
level = "info"
directory = "logs"

[distribution]
# BFVR must operate entirely relative to this parent folder.
portable_layout = true
game_executable = "..\\BF1942.exe"
